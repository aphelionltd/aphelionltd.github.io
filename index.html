<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aphelion</title>
<meta name="description" content="Aphelion. Coming soon.">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#050507">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #050507;
    --fg: #f4f4f5;
    --muted: #9a9aa2;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: radial-gradient(ellipse at 50% 120%, #101018 0%, var(--bg) 60%);
    color: var(--fg);
    font-family: "Outfit", "Segoe UI", system-ui, -apple-system, sans-serif;
    overflow: hidden;
  }
  #stars {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
  }
  main {
    position: relative;
    z-index: 1;
    min-height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    /* extra bottom padding nudges the centred block up to make room for the diagram */
    padding: 24px 16px calc(24px + clamp(80px, 14vh, 140px));
    text-align: center;
  }
  .content {
    position: relative;
  }
  .logo {
    animation: rise 1.4s ease-out 0.15s both;
  }
  /* hangs below the content without taking part in the layout */
  .orbit {
    display: block;
    position: absolute;
    left: 0;
    right: 0;
    top: 100%;
    width: clamp(230px, 24vw, 340px);
    aspect-ratio: 20 / 11;
    margin: clamp(10px, 2.5vh, 24px) auto 0;
    animation: rise 1.4s ease-out 0.85s both;
  }
  .logo-svg {
    display: block;
    width: clamp(280px, 62vw, 800px);
    height: auto;
    filter: drop-shadow(0 0 22px rgba(255,255,255,0.14));
  }
  .soon {
    margin-top: clamp(22px, 4vh, 40px);
    animation: rise 1.4s ease-out 0.45s both;
  }
  .soon .label {
    font-size: clamp(13px, 1.8vw, 17px);
    letter-spacing: 0.5em;
    padding-left: 0.5em;
    text-transform: uppercase;
    color: var(--fg);
    font-weight: 500;
  }
  .soon .line {
    width: 56px;
    height: 1px;
    margin: 10px auto 0;
    background: linear-gradient(90deg, transparent, #fff, transparent);
    opacity: 0.6;
    animation: pulse 3.6s ease-in-out infinite;
  }
  .contact {
    margin-top: 12px;
    animation: rise 1.4s ease-out 0.7s both;
  }
  .contact a {
    color: var(--muted);
    text-decoration: none;
    font-size: clamp(13px, 1.6vw, 16px);
    letter-spacing: 0.12em;
    border-bottom: 1px solid transparent;
    transition: color .25s, border-color .25s;
  }
  .contact a:hover, .contact a:focus-visible {
    color: var(--fg);
    border-bottom-color: rgba(255,255,255,0.5);
  }
  footer {
    position: fixed;
    bottom: 18px;
    left: 0;
    right: 0;
    z-index: 1;
    text-align: center;
    font-size: 12px;
    letter-spacing: 0.12em;
    color: #5f5f67;
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: none; }
  }
  @keyframes pulse {
    0%, 100% { opacity: 0.25; width: 40px; }
    50%      { opacity: 0.8;  width: 90px; }
  }
  @media (max-width: 520px) {
    .orbit { width: 64vw; }
    .logo-svg { width: 86vw; }
  }
  @media (prefers-reduced-motion: reduce) {
    .orbit, .logo, .soon, .soon .line, .contact { animation: none; }
  }
</style>
</head>
<body>
<canvas id="stars" aria-hidden="true"></canvas>

<main>
<div class="content">
  <div class="logo">
    <svg class="logo-svg" viewBox="0 0 1177 261" role="img" aria-label="Aphelion - cyber security" xmlns="http://www.w3.org/2000/svg">
      <image href="logo.png" width="1177" height="261"/>
      <text x="381" y="250" textLength="780" lengthAdjust="spacing" fill="#9a9aa2" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-weight="500" font-size="37">CYBER SECURITY</text>
    </svg>
  </div>

  <div class="soon">
    <div class="label">Coming soon</div>
    <div class="line"></div>
  </div>

  <p class="contact"><a href="mailto:info@aphelionltd.co.uk">info@aphelionltd.co.uk</a></p>

  <canvas id="orbit" class="orbit" aria-hidden="true"></canvas>
</div>
</main>

<footer>&copy; <span id="yr">2026</span> Aphelion Ltd</footer>

<script>
(function () {
  document.getElementById('yr').textContent = new Date().getFullYear();

  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var TAU = Math.PI * 2;
  var FONT = 'Outfit, "Segoe UI", system-ui, sans-serif';
  var PERIOD = 28000;           // ms for one full orbit
  var M0 = Math.PI - 0.6;       // start just short of aphelion so the label shows early
  var dpr = 1;

  function clamp(v, lo, hi) { return v < lo ? lo : v > hi ? hi : v; }

  /* ================= stars: full-screen background ================= */
  var sky = document.getElementById('stars');
  var sctx = sky.getContext('2d');
  var w = 0, h = 0, stars = [], shooters = [];

  function makeStars() {
    var count = Math.round((w * h) / 4500);
    stars = [];
    for (var i = 0; i < count; i++) {
      var depth = Math.random();
      stars.push({
        x: Math.random() * w,
        y: Math.random() * h,
        z: depth,
        r: 0.3 + depth * 1.3,
        speed: 0.01 + depth * 0.05,
        phase: Math.random() * Math.PI * 2,
        tw: 0.6 + Math.random() * 1.8
      });
    }
  }

  function spawnShooter() {
    shooters.push({
      x: Math.random() * w * 0.8 + w * 0.1,
      y: Math.random() * h * 0.4,
      vx: 6 + Math.random() * 4,
      vy: 2.5 + Math.random() * 2,
      life: 0
    });
  }

  function drawStars(t) {
    var c = sctx;
    c.clearRect(0, 0, w, h);
    for (var i = 0; i < stars.length; i++) {
      var s = stars[i];
      if (!reduce) {
        s.y += s.speed;
        s.x += s.speed * 0.4;
        if (s.y > h + 2) { s.y = -2; s.x = Math.random() * w; }
        if (s.x > w + 2) { s.x = -2; }
      }
      var a = 0.35 + 0.65 * (0.5 + 0.5 * Math.sin(t * 0.001 * s.tw + s.phase));
      if (reduce) a = 0.7;
      c.globalAlpha = a * (0.4 + s.z * 0.6);
      c.fillStyle = '#fff';
      c.beginPath();
      c.arc(s.x, s.y, s.r, 0, TAU);
      c.fill();
    }
    c.globalAlpha = 1;

    if (reduce) return;
    if (Math.random() < 0.004 && shooters.length < 2) spawnShooter();
    for (var j = shooters.length - 1; j >= 0; j--) {
      var m = shooters[j];
      m.x += m.vx;
      m.y += m.vy;
      m.life++;
      var alpha = Math.max(0, 1 - m.life / 60);
      var g = c.createLinearGradient(m.x, m.y, m.x - m.vx * 9, m.y - m.vy * 9);
      g.addColorStop(0, 'rgba(255,255,255,' + alpha + ')');
      g.addColorStop(1, 'rgba(255,255,255,0)');
      c.strokeStyle = g;
      c.lineWidth = 1.5;
      c.beginPath();
      c.moveTo(m.x, m.y);
      c.lineTo(m.x - m.vx * 9, m.y - m.vy * 9);
      c.stroke();
      if (m.life > 60) shooters.splice(j, 1);
    }
  }

  /* ================= orbit: small diagram above the logo ================= */
  // A real ellipse with the Sun at one focus. In the orbit's own frame the major
  // axis runs along x, perihelion at (-a, 0) and aphelion at (+a, 0).
  var oc = document.getElementById('orbit');
  var octx = oc.getContext('2d');
  var ow = 0, oh = 0, orbit = null;

  function toScreen(x, y) {
    return { x: orbit.cx + x * orbit.cos - y * orbit.sin,
             y: orbit.cy + x * orbit.sin + y * orbit.cos };
  }

  function layoutOrbit() {
    var rect = oc.getBoundingClientRect();
    ow = rect.width; oh = rect.height;
    oc.width = Math.round(ow * dpr);
    oc.height = Math.round(oh * dpr);
    octx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (ow < 40 || oh < 20) { orbit = null; return; }
    var a = ow * 0.42, b = ow * 0.19;
    var c = Math.sqrt(a * a - b * b);
    var tilt = -6 * Math.PI / 180;
    orbit = { cx: ow / 2, cy: oh / 2, a: a, b: b, e: c / a, tilt: tilt,
              cos: Math.cos(tilt), sin: Math.sin(tilt), S: ow / 340 };
    orbit.sun = toScreen(-c, 0);
    orbit.aphelion = toScreen(a, 0);
  }

  function kepler(M) {
    var e = orbit.e;
    M = M % TAU; if (M < 0) M += TAU;
    var E = e > 0.8 ? Math.PI : M;
    for (var i = 0; i < 16; i++) {
      var d = (E - e * Math.sin(E) - M) / (1 - e * Math.cos(E));
      E -= d;
      if (Math.abs(d) < 1e-8) break;
    }
    return E;
  }

  function posAt(M) {
    var E = kepler(M);
    var p = toScreen(-orbit.a * Math.cos(E), orbit.b * Math.sin(E));
    p.E = E;
    return p;
  }

  function spaced(c, text, x, y, font, spacing) {
    c.font = font;
    var widths = [], total = 0;
    for (var i = 0; i < text.length; i++) { widths[i] = c.measureText(text[i]).width; total += widths[i]; }
    total += spacing * (text.length - 1);
    var align = c.textAlign;
    var sx = align === 'right' ? x - total : align === 'center' ? x - total / 2 : x;
    c.textAlign = 'left';
    for (var j = 0; j < text.length; j++) { c.fillText(text[j], sx, y); sx += widths[j] + spacing; }
    c.textAlign = align;
  }

  function drawLabel(alpha) {
    var c = octx, o = orbit, ap = o.aphelion;
    var dx = o.cx - ap.x, dy = o.cy - ap.y, d = Math.hypot(dx, dy) || 1;
    dx /= d; dy /= d;
    var size = clamp(Math.round(ow * 0.03), 8, 10);
    var two = ow >= 280;                        // room for the second line
    var x = ap.x + dx * 20, y = ap.y + dy * 20;   // tucked inside the far end of the ellipse
    c.save();
    c.globalAlpha = alpha;
    c.textAlign = 'right';
    c.textBaseline = 'middle';
    c.fillStyle = 'rgba(244,244,245,0.9)';
    spaced(c, 'APHELION', x, two ? y - size * 0.7 : y, '500 ' + size + 'px ' + FONT, size * 0.42);
    if (two) {
      c.fillStyle = 'rgba(154,154,162,0.9)';
      spaced(c, 'farthest point from the sun', x, y + size * 0.8, '400 ' + Math.round(size * 0.92) + 'px ' + FONT, 0.5);
    }
    c.restore();
  }

  function drawOrbit(t) {
    var c = octx, o = orbit, S = o.S;
    var M = reduce ? Math.PI : M0 + TAU * (t / PERIOD);
    var p = posAt(M);
    var dE = Math.abs(p.E - Math.PI);          // angular distance from aphelion
    var near = clamp(1 - (dE - 0.22) / 0.22, 0, 1);

    c.clearRect(0, 0, ow, oh);

    // path with ticks at perihelion and aphelion
    c.save();
    c.translate(o.cx, o.cy);
    c.rotate(o.tilt);
    c.lineWidth = 1;
    c.strokeStyle = 'rgba(255,255,255,0.22)';
    c.beginPath(); c.ellipse(0, 0, o.a, o.b, 0, 0, TAU); c.stroke();
    c.strokeStyle = 'rgba(255,255,255,0.4)';
    c.beginPath();
    c.moveTo(o.a, -4); c.lineTo(o.a, 4);
    c.moveTo(-o.a, -4); c.lineTo(-o.a, 4);
    c.stroke();
    c.restore();

    // Sun-to-body distance line while the body sits at aphelion
    if (near > 0) {
      var s = o.sun, k = 0.45 * near;
      var lg = c.createLinearGradient(s.x, s.y, p.x, p.y);
      lg.addColorStop(0, 'rgba(255,255,255,' + k + ')');
      lg.addColorStop(0.35, 'rgba(255,255,255,' + k * 0.25 + ')');
      lg.addColorStop(0.65, 'rgba(255,255,255,' + k * 0.25 + ')');
      lg.addColorStop(1, 'rgba(255,255,255,' + k + ')');
      c.save();
      c.setLineDash([2, 5]);
      c.strokeStyle = lg;
      c.lineWidth = 1;
      c.beginPath(); c.moveTo(s.x, s.y); c.lineTo(p.x, p.y); c.stroke();
      c.restore();
    }

    // Sun
    var pulse = reduce ? 1 : 1 + 0.06 * Math.sin(t / 1400);
    var R = 34 * S * pulse;
    var sg = c.createRadialGradient(o.sun.x, o.sun.y, 0, o.sun.x, o.sun.y, R);
    sg.addColorStop(0, 'rgba(255,255,255,0.6)');
    sg.addColorStop(0.18, 'rgba(255,255,255,0.18)');
    sg.addColorStop(1, 'rgba(255,255,255,0)');
    c.fillStyle = sg;
    c.beginPath(); c.arc(o.sun.x, o.sun.y, R, 0, TAU); c.fill();
    c.fillStyle = '#fff';
    c.beginPath(); c.arc(o.sun.x, o.sun.y, 3.2, 0, TAU); c.fill();

    // trail sampled back in time, so it stretches when the body is moving fast
    if (!reduce) {
      var N = 30, dM = TAU * (24 / PERIOD), prev = p;
      for (var i = 1; i <= N; i++) {
        var q = posAt(M - i * dM), f = 1 - i / N;
        c.strokeStyle = 'rgba(255,255,255,' + (0.6 * f) + ')';
        c.lineWidth = 1.8 * f + 0.2;
        c.beginPath(); c.moveTo(prev.x, prev.y); c.lineTo(q.x, q.y); c.stroke();
        prev = q;
      }
    }

    // the orbiting body, with a glow while it sits at aphelion
    if (near > 0) {
      var pg = c.createRadialGradient(p.x, p.y, 0, p.x, p.y, 16);
      pg.addColorStop(0, 'rgba(255,255,255,' + 0.4 * near + ')');
      pg.addColorStop(1, 'rgba(255,255,255,0)');
      c.fillStyle = pg;
      c.beginPath(); c.arc(p.x, p.y, 16, 0, TAU); c.fill();
    }
    c.fillStyle = '#fff';
    c.beginPath(); c.arc(p.x, p.y, 2.4, 0, TAU); c.fill();

    if (near > 0) drawLabel(near);
  }

  /* ================= main loop ================= */
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    w = window.innerWidth;
    h = window.innerHeight;
    sky.width = w * dpr;
    sky.height = h * dpr;
    sctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (w >= 40 && h >= 40) makeStars(); else stars = [];
    layoutOrbit();
  }

  function draw(t) {
    t = t || 0;
    if (stars.length) drawStars(t);
    if (orbit) drawOrbit(t);
    if (!reduce) requestAnimationFrame(draw);
  }

  window.addEventListener('resize', function () { resize(); if (reduce) draw(0); });
  resize();
  requestAnimationFrame(draw);
  if (reduce && document.fonts && document.fonts.ready) document.fonts.ready.then(function () { draw(0); });
})();
</script>
</body>
</html>
